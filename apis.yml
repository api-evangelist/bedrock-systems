aid: bedrock-systems
name: Bedrock Systems
description: 'BedRock Systems (now operating as BlueRock Security, Inc) is a United States based
  cybersecurity company building formally verified systems software for critical infrastructure. Its
  work centers on the NOVA microhypervisor and virtual machine introspection (VMI) tooling, using
  machine-checked mathematical proofs written in Coq to establish strong security guarantees for
  virtualization, edge, and embedded platforms. The company open-sources core components — including the
  NOVA microhypervisor, the tenjint VMI platform, and supporting Coq libraries — on GitHub, and does not
  publish a public web/REST API surface.'
